# Configuración de Supabase local.
# Equivalente a lo que genera `supabase init`, escrito a mano porque la CLI no estaba
# disponible en el entorno de desarrollo inicial.

project_id = "puzzle-sync"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# CRÍTICO: la identidad del jugador se apoya en sesiones anónimas (research R1).
# Sin esto, `auth.uid()` es null, RLS no puede distinguir jugadores y el canal privado
# de Realtime no se puede restringir a los miembros de una sala.
enable_anonymous_sign_ins = true

# `enable_signup` global se deja activo a propósito: desactivarlo bloquea también las sesiones
# anónimas, de las que depende toda la identidad del jugador. El registro tradicional se cierra
# donde corresponde, en el proveedor de email, y la aplicación no expone ninguna ruta que lo use
# (Principio III: sin muros de login para jugadores).
enable_signup = true

[auth.email]
# Tiene que estar activo: esta opción no controla solo el registro, activa el proveedor de email
# entero. Con `false`, Supabase responde `422 Email logins are disabled` a CUALQUIER inicio de
# sesión con contraseña, incluido el del administrador de la feature 003 en `/admin/login`.
#
# El valor venía de 001/002, cuando ningún usuario iniciaba sesión y cerrarlo no costaba nada.
# 003 añadió el acceso de administrador y no se revisó.
#
# Que alguien pueda registrarse por email no concede nada: el rol vive en `app_metadata.is_admin`
# y solo se escribe con la llave de servicio. La aplicación tampoco expone ninguna pantalla de
# registro (Principio III: sin muros de login para jugadores).
enable_signup = true
enable_confirmations = false

[analytics]
enabled = false
